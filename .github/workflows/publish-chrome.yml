name: Publish Chrome Extension

on:
  push:
    branches: [main]
    paths: [package.json]

concurrency:
  group: publish-chrome
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Chrome Web Store
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: version
        run: |
          CURRENT=$(jq -r '.version' package.json)
          git show HEAD~1:package.json > /tmp/prev.json 2>/dev/null || echo '{"version":""}' > /tmp/prev.json
          PREVIOUS=$(jq -r '.version' /tmp/prev.json)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.changed == 'true'

      - run: bun install --frozen-lockfile
        if: steps.version.outputs.changed == 'true'

      - run: bun run build
        if: steps.version.outputs.changed == 'true'

      - name: Upload & publish
        if: steps.version.outputs.changed == 'true'
        run: |
          cd dist/chrome-unpacked
          bunx chrome-webstore-upload-cli@3.3.2 upload --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
